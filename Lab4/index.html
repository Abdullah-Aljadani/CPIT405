<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CPIT-405 Lab 4</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			background-color: #111;
			font-family: Arial, sans-serif;
			margin: 0;
			min-height: 100vh;
			padding: 8px;
		}

		.form-container {
			background-color: #fff;
			margin: 0 auto;
			max-width: 365px;
			min-height: calc(100vh - 16px);
			padding: 8px 40px 38px;
		}

		h1 {
			font-family: Georgia, "Times New Roman", serif;
			font-size: 18px;
			margin: 0 0 12px;
			text-align: center;
		}

		label {
			display: block;
			font-size: 9px;
			font-weight: bold;
			margin: 4px 0 2px;
		}

		input,
		textarea,
		button {
			font: inherit;
			width: 100%;
		}

		input,
		textarea {
			border: 1px solid #d7d7d7;
			border-radius: 2px;
			font-size: 8px;
			padding: 5px;
		}

		input {
			height: 22px;
		}

		textarea {
			display: block;
			line-height: 1.4;
			min-height: 120px;
			resize: vertical;
		}

		button {
			background-color: #000;
			border: 0;
			border-radius: 2px;
			color: #fff;
			cursor: pointer;
			font-size: 8px;
			height: 20px;
			margin-top: 4px;
		}

		button:hover,
		button:focus-visible {
			background-color: #333;
		}

		@media (max-width: 440px) {
			body {
				padding: 0;
			}

			.form-container {
				min-height: 100vh;
				padding-left: 24px;
				padding-right: 24px;
			}
		}
	</style>
</head>
<body>
	<main class="form-container">
		<h1>Great Auto Parts - Order Form</h1>

		<form action="#" method="post">
			<label for="first-name">First Name:</label>
			<input id="first-name" name="first-name" type="text" placeholder="Enter your first name" required>

			<label for="last-name">Last Name:</label>
			<input id="last-name" name="last-name" type="text" placeholder="Enter your last name" required>

			<label for="email">Email:</label>
			<input id="email" name="email" type="email" placeholder="Enter your email address" required>

			<label for="phone">Phone number:</label>
			<input id="phone" name="phone" type="tel" placeholder="Enter your phone number" required>

			<label for="make">Make:</label>
			<input id="make" name="make" type="text" placeholder="Make" required>

			<label for="model">Model:</label>
			<input id="model" name="model" type="text" placeholder="Model" required>

			<label for="year">Year:</label>
			<input id="year" name="year" type="number" placeholder="Year" min="1886" max="2100" required>

			<label for="date">Date:</label>
			<input id="date" name="date" type="date" required>

			<label for="spare-part">Spare Part:</label>
			<input id="spare-part" name="spare-part" type="text" placeholder="Enter the spare part you need" required>

			<label for="quantity">Quantity:</label>
			<input id="quantity" name="quantity" type="number" placeholder="Enter the quantity of the spare part you need" min="1" required>

			<label for="comment">Comment:</label>
			<textarea id="comment" name="comment" placeholder="Enter your comment" rows="7"></textarea>

			<button type="submit">Submit</button>
		</form>
	</main>
</body>
</html>
