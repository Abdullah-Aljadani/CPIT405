<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CPIT-405 Lab 5 - NBA Player Stats</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="container">
		<header>
			<div>
				<p class="eyebrow">CPIT-405 / LAB 05</p>
				<h1>NBA Player Stats</h1>
				<p class="subtitle">Search, filter, and compare player performance.</p>
				<p class="student-info">Name: Abdullah Aljadani | ID: 2342239</p>
			</div>
			<button id="dark-mode-toggle" type="button">Dark mode</button>
		</header>

		<section class="table-filters" aria-label="Table filters">
			<label for="search">Search players
				<input type="search" id="search" placeholder="Search by player or team...">
			</label>
			<label for="team-filter">Team
				<select id="team-filter">
					<option value="all">All teams</option>
				</select>
			</label>
			<p id="result-count" aria-live="polite"></p>
		</section>

		<div class="table-wrap">
			<table id="player-stats">
				<caption class="sr-only">NBA player statistics</caption>
				<thead>
					<tr>
						<th scope="col" data-sort="name">Name <span aria-hidden="true">↕</span></th>
						<th scope="col" data-sort="team">Team <span aria-hidden="true">↕</span></th>
						<th scope="col" data-sort="points">Points <span aria-hidden="true">↕</span></th>
						<th scope="col" data-sort="rebounds">Rebounds <span aria-hidden="true">↕</span></th>
						<th scope="col" data-sort="assists">Assists <span aria-hidden="true">↕</span></th>
					</tr>
				</thead>
				<tbody id="player-rows"></tbody>
			</table>
		</div>
	</main>
	<script src="script.js"></script>
</body>
</html>
