<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CPIT-405 Lab 6 - Like and Dislike</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="container">
		<header>
			<p class="eyebrow">CPIT-405 / LAB 06</p>
			<h1>Share your opinion</h1>
			<p class="subtitle">Vote and leave one comment. Your choices are saved in cookies.</p>
			<p class="student-info">Name: Abdullah Aljadani | ID: 2342239</p>
		</header>

		<section class="voting-panel" aria-labelledby="vote-heading">
			<h2 id="vote-heading">How do you feel about this page?</h2>
			<div class="vote-actions">
				<button id="like-button" class="vote-button like-button" type="button" aria-describedby="like-count">
					<span aria-hidden="true">👍</span> Like
					<strong id="like-count">0</strong>
				</button>
				<button id="dislike-button" class="vote-button dislike-button" type="button" aria-describedby="dislike-count">
					<span aria-hidden="true">👎</span> Dislike
					<strong id="dislike-count">0</strong>
				</button>
			</div>
			<p id="vote-status" class="status" role="status" aria-live="polite"></p>
		</section>

		<section class="comments-panel" aria-labelledby="comments-heading">
			<h2 id="comments-heading">Comments</h2>
			<form id="comment-form">
				<label for="comment-input">Leave a comment</label>
				<div class="comment-entry">
					<input id="comment-input" name="comment" type="text" maxlength="200"
						placeholder="Write your comment..." required>
					<button type="submit">Post comment</button>
				</div>
			</form>
			<p id="comment-status" class="status" role="status" aria-live="polite"></p>
			<ul id="comments-list" class="comments-list"></ul>
			<p id="no-comments" class="empty-message">No comments yet.</p>
		</section>

		<section class="reset-panel" aria-label="Reset saved choices">
			<button id="reset-button" class="reset-button" type="button">Reset my vote and comment</button>
			<p>Resetting clears your saved cookies and lets you vote and comment again.</p>
		</section>
	</main>
	<script src="script.js?v=5"></script>
</body>
</html>
